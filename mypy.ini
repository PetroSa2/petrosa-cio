# Canonical mypy configuration for this repo (petrosa_k8s#1052 epic /
# petrosa-cio#180). mypy reads mypy.ini before pyproject.toml's [tool.mypy]
# section when both are present, so this file always wins; the duplicate
# block that used to live in pyproject.toml has been removed there.
[mypy]
python_version = 3.11
check_untyped_defs = True
ignore_missing_imports = True
