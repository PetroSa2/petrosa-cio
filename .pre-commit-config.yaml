# Golden Pre-Commit Configuration for Petrosa (v3.0)
# Use: copy to .pre-commit-config.yaml in any Petrosa repo

repos:
  # ==================================================================
  # CODE QUALITY - Ruff (Latest v0.9.9)
  # ==================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: ⚡ Ruff Linter & Fixer
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ⚡ Ruff Formatter

  # ==================================================================
  # TYPE CHECKING - Mypy (v1.15.0 — matches CI, non-blocking for now)
  # ==================================================================
  # Non-blocking on purpose: CI's own "Run Mypy" step is `continue-on-error:
  # true` today (PetroSa2/petrosa_k8s#1052 epic step 1/2 baselines the error
  # count and flips both gates to blocking together, shrink-only). A plain
  # `mirrors-mypy` hook would exit non-zero and fail this repo's unconditionally
  # blocking pre-commit gate ahead of that baseline (223 pre-existing errors
  # today), so this wraps mypy in the same non-blocking pattern via
  # scripts/run-mypy-precommit.sh.
  - repo: local
    hooks:
      - id: mypy
        name: 🔍 Mypy Type Checker (non-blocking)
        entry: scripts/run-mypy-precommit.sh
        language: python
        additional_dependencies: [
          'mypy==1.15.0',
          'pyyaml',
          'types-PyYAML',
          'types-requests',
          'types-setuptools',
          'pydantic'
        ]
        pass_filenames: false

  # ==================================================================
  # SECURITY - Gitleaks (de-networked: prebuilt binary, no `go install`)
  # ==================================================================
  # per #1043 §3 / #1052 epic step 0.2 / #180: the upstream `language: golang`
  # hook form runs `go install ./...` on a cold cache, a transient network
  # dependency on proxy.golang.org inside a blocking PR-path gate (root cause
  # of the petrosa-data-manager "Install pre-commit" flakes). This local
  # hook fetches the same prebuilt gitleaks release binary CI's
  # security-scan step already uses.
  - repo: local
    hooks:
      - id: gitleaks
        name: 🔐 Gitleaks (Secret Detection)
        entry: scripts/run-gitleaks-precommit.sh
        language: script
        pass_filenames: false

  # ==================================================================
  # SECURITY - Bandit (Latest v1.7.8)
  # ==================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: 🔐 Bandit (Python Security)
        # Scope the scan to project source under cio/ — the previous root-level
        # scan with -x globs did not actually skip venv contents and produced
        # thousands of findings in third-party packages.
        args: [-ll, -r, cio]
        exclude: ^tests/
        pass_filenames: false

  # ==================================================================
  # SECURITY - Dependency Check (Safety) — optional; see petrosa_k8s template
  # ==================================================================
  # - repo: https://github.com/pyupio/safety
  #   rev: 3.0.1
  #   hooks:
  #     - id: safety
  #       name: 🔐 Safety (Dependency Scan)
  #       args: [check, --full-report]
  #       files: ^requirements\.txt$

  # ==================================================================
  # LINTING - YAML & TOML
  # ==================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: 📋 YAML Linter

  # ==================================================================
  # STANDARD HOOKS
  # ==================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements

  # ==================================================================
  # LOCAL PETROSA HOOKS
  # ==================================================================
  - repo: local
    hooks:
      - id: check-test-assertions
        name: 🧪 Check Test Assertions
        entry: python3 scripts/check-test-assertions.py
        language: system
        types: [python]
        files: ^tests/
