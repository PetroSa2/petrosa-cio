name: Agent Checks

# Keeps one AGENTS.md per repository (pointer files only for other clients) and keeps restricted wording out of
# pull requests. Both checks are reusable workflows in petrosa-shared-workflows, pinned by commit.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  instructions:
    name: Agent instructions
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/agent-instructions.yml@f6a60cf427e7e99e2eb624ecfe067ce5f2602f90
    with:
      shared-ref: f6a60cf427e7e99e2eb624ecfe067ce5f2602f90

  wording:
    name: External wording
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/external-wording.yml@f6a60cf427e7e99e2eb624ecfe067ce5f2602f90
    with:
      shared-ref: f6a60cf427e7e99e2eb624ecfe067ce5f2602f90
