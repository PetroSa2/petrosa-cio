name: CI Checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pipeline:
    name: CI Pipeline
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@ac55a0ad451d63a6973d6228deebb5651814ca98  # yamllint disable-line rule:line-length
    with:
      service-name: 'cio'
      image-name: 'yurisa2/petrosa-cio'
      python-version: '3.11'
      skip-docker-build: true
      # Explicit per-repo floor (petrosa_k8s#1052 epic step 5 / #180). Measured
      # coverage is ~89% — per the socket-client precedent (petrosa-socket-
      # client#136 / PR #140), pin the canonical Golden Standard floor of 40
      # explicitly instead of a narrower ratchet.
      coverage-threshold: '40'
    secrets: inherit
