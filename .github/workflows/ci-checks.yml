name: CI Checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  cross-service-contract:
    name: Real CIO to tradeengine Contract
    runs-on: petrosa-org-runners
    steps:
      - name: Checkout CIO producer
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned contract and service dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run real producer-consumer contract
        run: pytest -q tests/test_contract_ci.py

  pipeline:
    name: CI Pipeline
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@6aebf4f0a2d3829dc0b507f6c2ef0a464dcda01c  # yamllint disable-line rule:line-length
    with:
      service-name: 'cio'
      image-name: 'yurisa2/petrosa-cio'
      python-version: '3.11'
      skip-docker-build: true
      # Explicit per-repo floor (petrosa_k8s#1052 epic step 5 / #180). Measured
      # coverage is ~89% — per the socket-client precedent (petrosa-socket-
      # client#136 / PR #140), pin the canonical Golden Standard floor of 40
      # explicitly instead of a narrower ratchet.
      coverage-threshold: '40'
    secrets: inherit
